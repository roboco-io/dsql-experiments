title: DSQL Experiment Notes
description: Public experiments comparing Aurora DSQL with RDS and Aurora on performance, operations effort, constraints, and cost
url: https://roboco.io
baseurl: /dsql-experiments
repository_url: https://github.com/roboco-io/dsql-experiments
lang: en
languages: [en, ko, ja]   # en is the default at the root; ko and ja live under /ko/ and /ja/
timezone: Asia/Seoul
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  experiments:
    output: true
    permalink: /experiments/:name/   # each report sets its own language-specific permalink
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: experiments
    values:
      layout: experiment
exclude:
  - superpowers
  - README.md
  - artifacts
  - vendor
